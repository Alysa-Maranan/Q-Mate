# Supervisor configuration for Laravel + Nginx + PHP-FPM

[supervisord]
nodaemon=true
user=root
stopsignal=QUIT

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
redirect_stderr=true